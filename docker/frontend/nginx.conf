# Nginx配置 - 闲鱼自动回复系统前端
server {
    listen 80;
    server_name localhost;
    
    # 根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;
    
    # 前端静态资源缓存（构建产物hash文件名）
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 前端独立存活检查，不依赖后端服务。
    location = /frontend-health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"success":true,"code":200,"message":"前端服务已启动","data":{"status":"running"}}';
    }

    # 公开状态通过前端地址访问；覆盖转发头，防止伪造 IP 绕过 Redis 限流。
    location ^~ /api/v1/public/ {
        # 使用 Docker 内置 DNS 定期解析，后端容器重建换 IP 后无需重启前端。
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 5s;
        set $public_status_backend http://backend-web:8089;
        proxy_pass $public_status_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =200 @public_status_unavailable;
    }

    location @public_status_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"success":false,"code":50303,"message":"状态查询服务暂不可用，请稍后重试","data":null}';
    }

    # API代理到后端服务
    location /api {
        client_max_body_size 50m;
        proxy_pass http://backend-web:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
    }
    
    # 后端健康检查代理
    location /health {
        proxy_pass http://backend-web:8089/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 后端静态文件代理（上传的图片、群二维码等，覆盖整个 /static）
    location /static {
        proxy_pass http://backend-web:8089/static;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # SPA路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
