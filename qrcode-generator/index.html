<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接生成二维码工具 · 支持闲鱼强制跳转浏览器</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    max-width: 980px;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; padding: 24px; }
  }
  h1 {
    font-size: 24px;
    color: #1a1a2e;
    margin-bottom: 8px;
    grid-column: 1 / -1;
  }
  .subtitle {
    color: #666;
    font-size: 14px;
    grid-column: 1 / -1;
    margin-bottom: 20px;
  }
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
    font-size: 14px;
  }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s;
    outline: none;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 72px; }
  input:focus, textarea:focus { border-color: #667eea; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; }
  input[type="color"] { width: 100%; height: 44px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; padding: 4px; }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button:hover { box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
  button:active { transform: scale(0.98); }
  button.secondary { background: #f5f5f5; color: #333; }
  .preview-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f8f9fc;
    border-radius: 12px;
    padding: 30px;
    min-height: 400px;
  }
  #qrcode-container {
    max-width: 100%;
    border-radius: 8px;
    background: #fff;
    padding: 12px;
  }
  #qrcode-container canvas, #qrcode-container img { max-width: 100%; height: auto; display: block; }
  .placeholder { color: #aaa; text-align: center; font-size: 14px; }
  .placeholder svg { width: 80px; height: 80px; opacity: 0.3; margin-bottom: 16px; }
  .notice {
    background: #fff8e1;
    border-left: 4px solid #ffc107;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    color: #795548;
    margin-top: 16px;
    line-height: 1.6;
  }
  .notice strong { color: #e65100; }
  .notice.ok { background: #e8f5e9; border-left-color: #4caf50; color: #2e7d32; }
  .notice.ok strong { color: #1b5e20; }
  .btn-row { display: flex; gap: 10px; }
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f5f6fa;
    border: 1px solid #e8eaf0;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  .switch-row .text { font-size: 14px; font-weight: 600; color: #333; }
  .switch-row .hint { font-size: 12px; color: #888; font-weight: 400; margin-top: 2px; }
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-sw {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .3s; border-radius: 26px;
  }
  .slider-sw:before {
    position: absolute; content: "";
    height: 20px; width: 20px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .3s; border-radius: 50%;
  }
  input:checked + .slider-sw { background: linear-gradient(135deg, #667eea, #764ba2); }
  input:checked + .slider-sw:before { transform: translateX(20px); }
  .qr-content {
    background: #f5f6fa;
    border: 1px dashed #d0d5e0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    color: #666;
    word-break: break-all;
    margin-top: 14px;
    max-height: 80px;
    overflow-y: auto;
    font-family: ui-monospace, Menlo, monospace;
  }
  .qr-content-label { font-size: 11px; color: #999; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>🔗 链接生成二维码工具</h1>
  <p class="subtitle">输入任意链接，生成二维码图片。支持「闲鱼扫码后强制跳转浏览器」模式。</p>

  <div class="form-area">
    <div class="form-group">
      <label for="url">目标链接</label>
      <textarea id="url" placeholder="请输入 https:// 开头的链接...">https://xianyu.jinan.me/Xian_goods/App.php?ClickID=455&te=62</textarea>
    </div>

    <!-- 强制浏览器打开开关 -->
    <div class="switch-row">
      <div>
        <div class="text">🚀 闲鱼强制跳转浏览器</div>
        <div class="hint">开启后二维码指向跳转页，扫码自动唤起系统浏览器</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="forceBrowser" checked>
        <span class="slider-sw"></span>
      </label>
    </div>

    <div class="form-group" id="redirectGroup">
      <label for="redirectUrl">跳转页地址 (redirect.html)</label>
      <input type="text" id="redirectUrl" value="https://xianyu.jinan.me/redirect.html" placeholder="如 https://你的域名/redirect.html">
      <div style="font-size:12px;color:#999;margin-top:6px;">部署时填 redirect.html 的完整可访问地址；本地预览用相对路径即可。</div>
    </div>

    <div class="form-group">
      <label>尺寸</label>
      <input type="number" id="size" value="320" min="100" max="1000" step="10">
    </div>

    <div class="form-group">
      <div class="color-row">
        <div>
          <label>前景色</label>
          <input type="color" id="fgColor" value="#000000">
        </div>
        <div>
          <label>背景色</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
      </div>
    </div>

    <button onclick="generateQR()">生成二维码</button>
    <div class="btn-row" style="margin-top:10px;">
      <button class="secondary" onclick="downloadQR()" style="margin-top:0;">下载 PNG</button>
      <button class="secondary" onclick="copyLink()" style="margin-top:0;">复制二维码内容</button>
    </div>

    <div class="notice ok" id="noticeOk">
      <strong>✅ 已开启强制跳转模式：</strong><br>
      二维码内容为跳转页地址，闲鱼扫码后会<strong>自动尝试唤起系统浏览器</strong>打开目标链接。若被系统拦截，页面会显示「在浏览器中打开」按钮引导用户手动操作。
    </div>
  </div>

  <div class="preview-area" id="preview">
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 13h2v2h-2zM17 13h2v2h-2zM13 17h2v2h-2zM17 17h2v2h-2zM21 13h-2v2h2zM21 17h-2v2h2zM13 21h2v-2h-2zM17 21h2v-2h-2zM21 21h-2v-2h2z"/></svg>
      <p>输入链接后点击「生成二维码」</p>
    </div>
    <div id="qrcode-container" style="display:none;"></div>
    <div class="qr-content-label" id="qrLabel" style="display:none;">二维码实际内容：</div>
    <div class="qr-content" id="qrContent" style="display:none;"></div>
  </div>
</div>

<script>
  var DEFAULT_REDIRECT = 'redirect.html';
  var PRESET_URL = 'https://xianyu.jinan.me/Xian_goods/App.php?ClickID=455&te=62';

  function buildQrContent() {
    var target = document.getElementById('url').value.trim();
    if (!target) target = PRESET_URL;
    var force = document.getElementById('forceBrowser').checked;
    if (force) {
      var base = document.getElementById('redirectUrl').value.trim() || DEFAULT_REDIRECT;
      // 拼接跳转页 + url 参数
      var sep = base.indexOf('?') >= 0 ? '&' : '?';
      return base + sep + 'url=' + encodeURIComponent(target);
    }
    return target;
  }

  function generateQR() {
    var text = document.getElementById('url').value.trim();
    if (!text) { alert('请输入链接或文本内容'); return; }
    var qrText = buildQrContent();
    var size = parseInt(document.getElementById('size').value) || 320;
    var fgColor = document.getElementById('fgColor').value;
    var bgColor = document.getElementById('bgColor').value;

    var container = document.getElementById('qrcode-container');
    var placeholder = document.getElementById('placeholder');

    container.innerHTML = '';
    try {
      new QRCode(container, {
        text: qrText,
        width: size,
        height: size,
        colorDark: fgColor,
        colorLight: bgColor,
        correctLevel: QRCode.CorrectLevel.H
      });
      container.style.display = 'block';
      placeholder.style.display = 'none';
      document.getElementById('qrContent').textContent = qrText;
      document.getElementById('qrContent').style.display = 'block';
      document.getElementById('qrLabel').style.display = 'block';
    } catch (err) {
      alert('生成失败：' + err.message);
    }
  }

  function downloadQR() {
    var container = document.getElementById('qrcode-container');
    var canvas = container.querySelector('canvas');
    if (!canvas) { alert('请先生成二维码'); return; }
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'qrcode_' + Date.now() + '.png';
    a.click();
  }

  function copyLink() {
    var text = buildQrContent();
    navigator.clipboard.writeText(text).then(function () {
      alert('二维码内容已复制到剪贴板');
    }).catch(function () {
      alert('复制失败，请手动复制');
    });
  }

  // 开关联动
  document.getElementById('forceBrowser').addEventListener('change', function (e) {
    var on = e.target.checked;
    document.getElementById('redirectGroup').style.display = on ? '' : 'none';
    document.getElementById('noticeOk').style.display = on ? '' : 'none';
  });

  // 回车快捷生成
  document.getElementById('url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      generateQR();
    }
  });

  // 页面加载自动生成一次
  window.addEventListener('load', function () {
    generateQR();
  });
</script>
</body>
</html>
