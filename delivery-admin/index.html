<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲鱼发货管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 22px; }
  .header .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .container { padding: 24px 40px; max-width: 1400px; margin: 0 auto; }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 2px solid #e0e0e0;
  }
  .tab {
    padding: 12px 24px;
    cursor: pointer;
    border: none;
    background: none;
    font-size: 15px;
    color: #666;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
  }
  .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
  .tab:hover { color: #667eea; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* 卡片 */
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: #667eea; color: #fff; }
  .btn-primary:hover { background: #5568d3; }
  .btn-secondary { background: #f5f5f5; color: #333; }
  .btn-secondary:hover { background: #e8e8e8; }
  .btn-danger { background: #ff4d4f; color: #fff; }
  .btn-danger:hover { background: #d9363e; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* 表单 */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group.full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type="text"], input[type="url"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  input:focus, textarea:focus { border-color: #667eea; }
  textarea { resize: vertical; min-height: 60px; }

  /* 表格 */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th {
    text-align: left;
    padding: 12px;
    background: #fafafa;
    color: #666;
    font-weight: 600;
    border-bottom: 1px solid #eee;
  }
  td {
    padding: 12px;
    border-bottom: 1px solid #f0f0f0;
    color: #333;
  }
  tr:hover { background: #fafafa; }
  .actions { display: flex; gap: 8px; }

  /* 商品卡片 */
  .goods-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .goods-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid #eee;
  }
  .goods-card h3 {
    font-size: 16px;
    margin-bottom: 8px;
    color: #1a1a2e;
  }
  .goods-card .meta {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .goods-card .meta span { color: #333; }
  .goods-card .qr-wrap {
    display: flex;
    justify-content: center;
    margin: 12px 0;
    padding: 12px;
    background: #f8f9fc;
    border-radius: 8px;
  }
  .goods-card .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  /* 弹窗 */
  .modal-mask {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 20px; color: #1a1a2e; }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }

  /* 配置区 */
  .config-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .config-row .form-group { flex: 1; margin-bottom: 0; }

  .empty {
    text-align: center;
    padding: 40px;
    color: #999;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .tag-green { background: #f6ffed; color: #52c41a; }
  .tag-orange { background: #fff7e6; color: #fa8c16; }

  .notice {
    background: #fffbe6;
    border: 1px solid #ffe58f;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #876800;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .notice strong { color: #d48806; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📦 闲鱼发货管理后台</h1>
    <div class="sub">商品管理 · 二维码生成 · 发货记录</div>
  </div>
  <button class="btn btn-secondary" onclick="exportData()">📤 导出数据</button>
</div>

<div class="container">

  <div class="notice">
    <strong>⚠️ 使用说明：</strong><br>
    1. 先在「系统设置」中配置发货页面的访问地址（部署后填写）<br>
    2. 添加商品并填上网盘链接和提取码<br>
    3. 生成二维码，发给买家。买家用闲鱼扫码 → 点「在浏览器中打开」→ 查看发货内容
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('goods')">商品管理</button>
    <button class="tab" onclick="switchTab('orders')">发货记录</button>
    <button class="tab" onclick="switchTab('settings')">系统设置</button>
  </div>

  <!-- 商品管理 -->
  <div class="panel active" id="panel-goods">
    <div class="card">
      <div class="card-title">
        <span>商品列表</span>
        <button class="btn btn-primary" onclick="openGoodsModal()">+ 添加商品</button>
      </div>
      <div id="goodsList" class="goods-grid"></div>
    </div>
  </div>

  <!-- 发货记录 -->
  <div class="panel" id="panel-orders">
    <div class="card">
      <div class="card-title">
        <span>发货记录</span>
        <button class="btn btn-primary" onclick="openOrderModal()">+ 记录发货</button>
      </div>
      <div id="orderList"></div>
    </div>
  </div>

  <!-- 系统设置 -->
  <div class="panel" id="panel-settings">
    <div class="card">
      <div class="card-title"><span>系统设置</span></div>
      <div class="form-group">
        <label>发货页面基础地址（部署 delivery.html 后的访问地址）</label>
        <div class="config-row">
          <input type="url" id="baseUrl" placeholder="例如：https://18488292860-coder.github.io/xianyu-auto-reply/qrcode-generator/">
          <button class="btn btn-primary" onclick="saveBaseUrl()">保存</button>
        </div>
        <div style="font-size:12px;color:#999;margin-top:8px;">
          二维码内容 = 基础地址 + delivery.html?goods=商品ID<br>
          例如部署到 GitHub Pages 后，地址类似上面的示例
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>数据管理</span></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-secondary" onclick="exportData()">📤 导出全部数据（JSON）</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空全部数据</button>
      </div>
    </div>
  </div>

</div>

<!-- 商品弹窗 -->
<div class="modal-mask" id="goodsModal">
  <div class="modal">
    <h2 id="goodsModalTitle">添加商品</h2>
    <input type="hidden" id="goodsId">
    <div class="form-group">
      <label>商品名称 *</label>
      <input type="text" id="goodsName" placeholder="例如：XX教程">
    </div>
    <div class="form-group">
      <label>网盘链接 *</label>
      <input type="url" id="goodsLink" placeholder="https://pan.baidu.com/s/xxxxx">
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>提取码</label>
        <input type="text" id="goodsCode" placeholder="例如：abcd">
      </div>
      <div class="form-group">
        <label>商品分类</label>
        <input type="text" id="goodsCategory" placeholder="例如：教程/素材">
      </div>
    </div>
    <div class="form-group">
      <label>商品描述</label>
      <textarea id="goodsDesc" placeholder="给买家看的发货说明..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeGoodsModal()">取消</button>
      <button class="btn btn-primary" onclick="saveGoods()">保存</button>
    </div>
  </div>
</div>

<!-- 二维码弹窗 -->
<div class="modal-mask" id="qrModal">
  <div class="modal" style="max-width:420px;text-align:center;">
    <h2 id="qrGoodsName">商品二维码</h2>
    <div id="qrDisplay" style="padding:20px;background:#f8f9fc;border-radius:8px;margin:16px 0;"></div>
    <div id="qrUrl" style="font-size:12px;color:#888;word-break:break-all;margin-bottom:16px;"></div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="btn btn-secondary" onclick="copyQrUrl()">复制链接</button>
      <button class="btn btn-primary" onclick="downloadQr()">下载二维码</button>
      <button class="btn btn-secondary" onclick="closeQrModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 发货记录弹窗 -->
<div class="modal-mask" id="orderModal">
  <div class="modal">
    <h2>记录发货</h2>
    <div class="form-group">
      <label>关联商品 *</label>
      <select id="orderGoods"></select>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>订单号 *</label>
        <input type="text" id="orderNo" placeholder="闲鱼订单号">
      </div>
      <div class="form-group">
        <label>买家昵称</label>
        <input type="text" id="orderBuyer" placeholder="选填">
      </div>
    </div>
    <div class="form-group">
      <label>备注</label>
      <textarea id="orderRemark" placeholder="选填"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeOrderModal()">取消</button>
      <button class="btn btn-primary" onclick="saveOrder()">保存</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'xianyu_delivery_data';

// 数据结构
let data = {
  baseUrl: '',
  goods: [],    // {id, name, link, code, category, desc, createdAt}
  orders: []    // {id, goodsId, goodsName, orderNo, buyer, remark, status, createdAt}
};

// 初始化
function init() {
  loadData();
  renderGoods();
  renderOrders();
  renderOrderGoodsSelect();
  document.getElementById('baseUrl').value = data.baseUrl || '';
}

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { data = JSON.parse(saved); } catch(e) {}
  }
  if (!data.goods) data.goods = [];
  if (!data.orders) data.orders = [];
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// Tab 切换
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ========== 商品管理 ==========
function renderGoods() {
  const list = document.getElementById('goodsList');
  if (data.goods.length === 0) {
    list.innerHTML = '<div class="empty" style="grid-column:1/-1;"><div class="empty-icon">📦</div><p>暂无商品，点击右上角「添加商品」</p></div>';
    return;
  }
  list.innerHTML = data.goods.map(g => `
    <div class="goods-card">
      <h3>${escapeHtml(g.name)}</h3>
      <div class="meta">
        链接：<span style="font-size:12px;">${escapeHtml(g.link.substring(0, 30))}...</span><br>
        提取码：<span>${g.code || '无'}</span><br>
        ${g.category ? '分类：<span>' + escapeHtml(g.category) + '</span>' : ''}
      </div>
      <div class="qr-wrap" id="qr-${g.id}"></div>
      <div class="actions">
        <button class="btn btn-primary btn-sm" onclick="showQr('${g.id}')">📱 二维码</button>
        <button class="btn btn-secondary btn-sm" onclick="editGoods('${g.id}')">✏️ 编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteGoods('${g.id}')">🗑️ 删除</button>
      </div>
    </div>
  `).join('');

  // 渲染每个商品的二维码
  data.goods.forEach(g => {
    const url = getDeliveryUrl(g.id);
    const el = document.getElementById('qr-' + g.id);
    if (el && url) {
      el.innerHTML = '';
      new QRCode(el, {
        text: url,
        width: 160,
        height: 160,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } else if (el) {
      el.innerHTML = '<div style="color:#ccc;font-size:12px;text-align:center;padding:20px 0;">请先在设置中<br>配置基础地址</div>';
    }
  });
}

function getDeliveryUrl(goodsId) {
  if (!data.baseUrl) return '';
  const g = data.goods.find(x => x.id === goodsId);
  if (!g) return '';
  const goodsData = {
    name: g.name,
    link: g.link,
    code: g.code || '',
    desc: g.desc || ''
  };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(goodsData))));
  let base = data.baseUrl;
  if (!base.endsWith('/')) base += '/';
  return base + 'delivery.html?data=' + encodeURIComponent(encoded);
}

function openGoodsModal() {
  document.getElementById('goodsModalTitle').textContent = '添加商品';
  document.getElementById('goodsId').value = '';
  document.getElementById('goodsName').value = '';
  document.getElementById('goodsLink').value = '';
  document.getElementById('goodsCode').value = '';
  document.getElementById('goodsCategory').value = '';
  document.getElementById('goodsDesc').value = '';
  document.getElementById('goodsModal').classList.add('show');
}

function editGoods(id) {
  const g = data.goods.find(x => x.id === id);
  if (!g) return;
  document.getElementById('goodsModalTitle').textContent = '编辑商品';
  document.getElementById('goodsId').value = g.id;
  document.getElementById('goodsName').value = g.name;
  document.getElementById('goodsLink').value = g.link;
  document.getElementById('goodsCode').value = g.code || '';
  document.getElementById('goodsCategory').value = g.category || '';
  document.getElementById('goodsDesc').value = g.desc || '';
  document.getElementById('goodsModal').classList.add('show');
}

function closeGoodsModal() {
  document.getElementById('goodsModal').classList.remove('show');
}

function saveGoods() {
  const id = document.getElementById('goodsId').value;
  const name = document.getElementById('goodsName').value.trim();
  const link = document.getElementById('goodsLink').value.trim();
  const code = document.getElementById('goodsCode').value.trim();
  const category = document.getElementById('goodsCategory').value.trim();
  const desc = document.getElementById('goodsDesc').value.trim();

  if (!name) { alert('请输入商品名称'); return; }
  if (!link) { alert('请输入网盘链接'); return; }

  if (id) {
    const g = data.goods.find(x => x.id === id);
    if (g) Object.assign(g, { name, link, code, category, desc });
  } else {
    data.goods.push({
      id: 'g_' + Date.now(),
      name, link, code, category, desc,
      createdAt: new Date().toISOString()
    });
  }
  saveData();
  renderGoods();
  renderOrderGoodsSelect();
  closeGoodsModal();
}

function deleteGoods(id) {
  if (!confirm('确定删除该商品？相关发货记录不会被删除。')) return;
  data.goods = data.goods.filter(g => g.id !== id);
  saveData();
  renderGoods();
  renderOrderGoodsSelect();
}

// ========== 二维码 ==========
let currentQrGoods = null;

function showQr(id) {
  const g = data.goods.find(x => x.id === id);
  if (!g) return;
  const url = getDeliveryUrl(id);
  if (!url) {
    alert('请先在「系统设置」中配置发货页面基础地址');
    switchTab('settings');
    return;
  }
  currentQrGoods = g;
  document.getElementById('qrGoodsName').textContent = g.name + ' - 二维码';
  document.getElementById('qrUrl').textContent = url;
  const display = document.getElementById('qrDisplay');
  display.innerHTML = '';
  new QRCode(display, {
    text: url,
    width: 260,
    height: 260,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  document.getElementById('qrModal').classList.add('show');
}

function closeQrModal() {
  document.getElementById('qrModal').classList.remove('show');
  currentQrGoods = null;
}

function copyQrUrl() {
  const url = document.getElementById('qrUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    alert('链接已复制');
  }).catch(() => alert('复制失败'));
}

function downloadQr() {
  const display = document.getElementById('qrDisplay');
  const canvas = display.querySelector('canvas');
  if (!canvas) return;
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = (currentQrGoods ? currentQrGoods.name : 'qrcode') + '_' + Date.now() + '.png';
  a.click();
}

// ========== 发货记录 ==========
function renderOrderGoodsSelect() {
  const sel = document.getElementById('orderGoods');
  sel.innerHTML = '<option value="">请选择商品</option>' +
    data.goods.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
}

function renderOrders() {
  const list = document.getElementById('orderList');
  if (data.orders.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><p>暂无发货记录</p></div>';
    return;
  }
  const sorted = [...data.orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  list.innerHTML = `
    <table>
      <thead>
        <tr><th>订单号</th><th>商品</th><th>买家</th><th>发货时间</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody>
        ${sorted.map(o => `
          <tr>
            <td>${escapeHtml(o.orderNo)}</td>
            <td>${escapeHtml(o.goodsName)}</td>
            <td>${escapeHtml(o.buyer || '-')}</td>
            <td>${formatDate(o.createdAt)}</td>
            <td><span class="tag tag-green">已发货</span></td>
            <td>
              <button class="btn btn-secondary btn-sm" onclick="showQr('${o.goodsId}')">📱 二维码</button>
              <button class="btn btn-danger btn-sm" onclick="deleteOrder('${o.id}')">🗑️</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function openOrderModal() {
  if (data.goods.length === 0) {
    alert('请先添加商品');
    switchTab('goods');
    return;
  }
  document.getElementById('orderGoods').value = '';
  document.getElementById('orderNo').value = '';
  document.getElementById('orderBuyer').value = '';
  document.getElementById('orderRemark').value = '';
  document.getElementById('orderModal').classList.add('show');
}

function closeOrderModal() {
  document.getElementById('orderModal').classList.remove('show');
}

function saveOrder() {
  const goodsId = document.getElementById('orderGoods').value;
  const orderNo = document.getElementById('orderNo').value.trim();
  const buyer = document.getElementById('orderBuyer').value.trim();
  const remark = document.getElementById('orderRemark').value.trim();

  if (!goodsId) { alert('请选择商品'); return; }
  if (!orderNo) { alert('请输入订单号'); return; }

  const g = data.goods.find(x => x.id === goodsId);
  data.orders.push({
    id: 'o_' + Date.now(),
    goodsId,
    goodsName: g.name,
    orderNo, buyer, remark,
    status: 'shipped',
    createdAt: new Date().toISOString()
  });
  saveData();
  renderOrders();
  closeOrderModal();
}

function deleteOrder(id) {
  if (!confirm('确定删除该发货记录？')) return;
  data.orders = data.orders.filter(o => o.id !== id);
  saveData();
  renderOrders();
}

// ========== 系统设置 ==========
function saveBaseUrl() {
  data.baseUrl = document.getElementById('baseUrl').value.trim();
  saveData();
  renderGoods();
  alert('保存成功');
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'xianyu_delivery_backup_' + Date.now() + '.json';
  a.click();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.goods || imported.orders) {
        if (confirm('导入将覆盖现有数据，确定继续？')) {
          data = imported;
          saveData();
          init();
          alert('导入成功');
        }
      } else {
        alert('文件格式不正确');
      }
    } catch (err) {
      alert('文件解析失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAllData() {
  if (!confirm('确定清空全部商品和发货记录？此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要清空所有数据吗？')) return;
  data = { baseUrl: '', goods: [], orders: [] };
  saveData();
  init();
  alert('已清空');
}

// ========== 工具 ==========
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-mask').forEach(m => {
  m.addEventListener('click', (e) => {
    if (e.target === m) m.classList.remove('show');
  });
});

init();
</script>
</body>
</html>
