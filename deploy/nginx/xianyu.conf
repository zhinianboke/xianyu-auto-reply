# 闲鱼自动回复系统 — 源码部署 nginx 站点配置（端口 8095）
#
# 部署位置：/etc/nginx/sites-available/xianyu（软链到 sites-enabled/）
# 用途：SPA 静态文件 + /api/v1 反代 + /static 上传资源反代 + /ws WebSocket 反代
#
# 注意：/static/ 必须反代到 backend-web（FastAPI StaticFiles 挂载点），
# 否则上传图片（展示入口图片/确认收货图片/卡券图片等）会被 SPA 回退吞掉，
# 浏览器拿到 index.html 导致图片加载失败（2026-09-25 实测踩坑）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8095;
    server_name _;

    # 前端静态文件
    root /opt/xianyu-auto-reply/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源（上传图片等）反代到 backend-web 的 StaticFiles 挂载点
    location /static/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
    }

    # API 反代到 backend-web（含 WebSocket 支持）
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;

        # WebSocket 升级（chat-new/ws/{account_id} 走 /api/v1/ 路径）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # WebSocket 反代到 websocket 服务（聊天等实时功能）
    location /ws {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
